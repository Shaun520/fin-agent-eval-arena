<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>金融 Agent 评测竞技场 · 同花顺问财 vs 豆包 / 千问 / 元宝</title>
<style>
  :root{
    --bg:#ffffff;
    --bg-soft:#f7f8fa;
    --bg-sunken:#f2f3f5;
    --sidebar:#fafbfc;
    --border:#e8eaed;
    --border-strong:#dcdfe4;
    --text:#14171a;
    --text-2:#41474d;
    --muted:#6b7280;
    --muted-2:#9aa1a9;
    --brand:#1f6feb;
    --brand-soft:#eaf1fe;
    --ok:#0e9f6e;
    --ok-soft:#e7f7f1;
    --warn:#c2790a;
    --warn-soft:#fdf3e2;
    --danger:#d92b2b;
    --danger-soft:#fdeceb;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 6px 20px rgba(16,24,40,.05);
    --r-lg:14px; --r-md:10px; --r-sm:7px;
    --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-14:14px; --fs-16:16px; --fs-18:18px; --fs-22:22px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
    font-size:var(--fs-14); line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#d8dbe0;border-radius:6px;border:3px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-thumb:hover{background:#c3c7cd;background-clip:content-box;border:3px solid transparent;}
  ::-webkit-scrollbar-track{background:transparent;}

  .app{display:flex;height:100vh;overflow:hidden;}

  /* ---------------- Sidebar ---------------- */
  .sidebar{
    width:264px;flex:0 0 264px;background:var(--sidebar);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:14px 12px 12px;overflow:auto;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;}
  .brand-mark{
    width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,#1f6feb,#5b8def);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex:0 0 30px;
  }
  .brand-title{font-size:var(--fs-14);font-weight:650;letter-spacing:.2px;}
  .brand-sub{font-size:var(--fs-11);color:var(--muted-2);line-height:1.3;}

  .segmented{
    display:flex;background:var(--bg-sunken);border-radius:9px;padding:3px;margin:0 4px 14px;
  }
  .segmented button{
    flex:1;border:0;background:transparent;padding:6px 0;border-radius:7px;cursor:pointer;
    font-size:var(--fs-13);color:var(--text-2);font-weight:500;transition:.15s;
  }
  .segmented button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.08);font-weight:600;}

  .nav{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px;}
  .nav-group-label{
    font-size:var(--fs-11);color:var(--muted-2);padding:12px 10px 5px;letter-spacing:.4px;
  }
  .nav-item{
    display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;border:0;background:transparent;
    cursor:pointer;color:var(--text-2);text-align:left;width:100%;transition:.12s;
  }
  .nav-item:hover{background:#f0f2f5;color:var(--text);}
  .nav-item.on{background:#eceff3;color:var(--text);font-weight:600;}
  .nav-item svg{width:16px;height:16px;flex:0 0 16px;color:var(--muted);}
  .nav-item.on svg{color:var(--brand);}
  .nav-item .cnt{margin-left:auto;font-size:var(--fs-11);color:var(--muted-2);font-weight:400;}

  .sidebar-foot{border-top:1px solid var(--border);padding-top:10px;margin-top:8px;}
  .prog-wrap{padding:0 8px 8px;}
  .prog-line{display:flex;justify-content:space-between;font-size:var(--fs-11);color:var(--muted);margin-bottom:5px;}
  .prog-bar{height:5px;border-radius:3px;background:var(--bg-sunken);overflow:hidden;}
  .prog-bar i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .3s;}

  /* ---------------- Main ---------------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);}
  .topbar{
    height:56px;flex:0 0 56px;border-bottom:1px solid var(--border);display:flex;align-items:center;
    gap:12px;padding:0 22px;background:#fff;
  }
  .tb-title{font-size:var(--fs-16);font-weight:650;white-space:nowrap;}
  .tb-sub{font-size:var(--fs-12);color:var(--muted);border-left:1px solid var(--border-strong);padding-left:12px;margin-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tb-right{position:relative;margin-left:auto;min-width:0;display:flex;align-items:center;gap:8px;}
  .content{flex:1;overflow:auto;padding:18px 22px 24px;}
  /* 常驻底栏：不随内容滚动 */
  .bottom-bar{flex:0 0 auto;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);}
  .bottom-bar:empty{display:none;}

  /* ---------------- Controls ---------------- */
  .btn{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);background:#fff;
    padding:6px 11px;border-radius:8px;cursor:pointer;font-size:var(--fs-13);color:var(--text-2);transition:.12s;white-space:nowrap;
  }
  .btn:hover{background:var(--bg-soft);border-color:#ccd1d8;}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}
  .btn.primary:hover{background:#1a61d1;}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted);}
  .btn.ghost:hover{background:var(--bg-soft);color:var(--text);}
  .btn.danger{color:var(--danger);border-color:#f0c8c6;}
  .btn.danger:hover{background:var(--danger-soft);}
  .btn.sm{padding:4px 8px;font-size:var(--fs-12);}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}
  select.ctl,input.ctl,textarea.ctl{
    border:1px solid var(--border-strong);background:#fff;border-radius:8px;padding:6px 9px;font-size:var(--fs-13);
    color:var(--text);outline:none;transition:.12s;
  }
  select.ctl:focus,input.ctl:focus,textarea.ctl:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
  textarea.ctl{width:100%;resize:vertical;line-height:1.55;}

  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .spacer{flex:1;}
  .card{
    background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);
  }
  .card-pad{padding:16px 18px;}
  .card-head{
    padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;
  }
  .card-head h3{margin:0;font-size:var(--fs-14);font-weight:650;}
  .card-head .hint{font-size:var(--fs-12);color:var(--muted);}

  .chip{
    display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:var(--fs-11);
    background:var(--bg-sunken);color:var(--text-2);border:1px solid transparent;white-space:nowrap;
  }
  .chip.brand{background:var(--brand-soft);color:#1552b8;}
  .chip.demo{background:var(--warn-soft);color:var(--warn);}
  .chip.ok{background:var(--ok-soft);color:var(--ok);}
  .chip.danger{background:var(--danger-soft);color:var(--danger);}
  .chip.risk{border-color:#f2d6a8;background:#fffaf0;color:#96650a;}
  .chip.mono{font-family:"Cascadia Mono",Consolas,monospace;letter-spacing:.2px;}

  /* ---------------- Arena ---------------- */
  .q-text{font-size:var(--fs-16);font-weight:600;line-height:1.55;margin:0 0 10px;}
  details.ref{margin-top:4px;border-top:1px dashed var(--border);padding-top:10px;}
  details.ref>summary{
    cursor:pointer;font-size:var(--fs-13);color:var(--brand);list-style:none;display:flex;align-items:center;gap:6px;font-weight:600;
  }
  details.ref>summary::-webkit-details-marker{display:none;}
  details.ref>summary:before{content:"▸";transition:.15s;display:inline-block;font-size:10px;}
  details.ref[open]>summary:before{transform:rotate(90deg);}
  .ref-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-top:12px;}
  @media (max-width:1080px){.ref-grid{grid-template-columns:1fr;}}
  .ref-box{background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;}
  .ref-box h4{margin:0 0 8px;font-size:var(--fs-12);color:var(--muted);font-weight:600;letter-spacing:.3px;}
  .kv{display:flex;flex-wrap:wrap;gap:6px;}
  .kv .v{
    background:#fff;border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:5px 9px;font-size:var(--fs-12);
    display:flex;flex-direction:column;line-height:1.35;
  }
  .kv .v b{font-family:"Cascadia Mono",Consolas,monospace;font-size:var(--fs-13);}
  .kv .v span{color:var(--muted);font-size:var(--fs-11);}
  .ev-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .ev-list li{font-size:var(--fs-12);color:var(--text-2);display:flex;gap:8px;align-items:baseline;}
  .ev-list li .d{color:var(--muted-2);font-family:"Cascadia Mono",Consolas,monospace;flex:0 0 78px;font-size:var(--fs-11);}

  .answers{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr));}
  @media (max-width:1240px){.answers{grid-template-columns:1fr;}}
  .answer-card{display:flex;flex-direction:column;overflow:hidden;}
  .ac-head{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;}
  .ac-name{font-weight:650;font-size:var(--fs-14);}
  .ac-body{padding:14px;border-bottom:1px solid var(--border);background:#fcfcfd;}
  .ans-text{white-space:pre-wrap;font-size:var(--fs-13);line-height:1.72;color:var(--text-2);min-height:2em;}
  .cursor{display:inline-block;width:7px;height:14px;background:var(--brand);vertical-align:-2px;animation:blink 1s steps(1) infinite;border-radius:1px;}
  @keyframes blink{50%{opacity:0;}}
  .cite-wrap{margin-top:12px;border-top:1px dashed var(--border);padding-top:10px;}
  .cite-title{font-size:var(--fs-11);color:var(--muted);margin-bottom:6px;letter-spacing:.3px;}
  .cite{display:flex;gap:8px;font-size:var(--fs-12);color:var(--text-2);padding:3px 0;align-items:baseline;}
  .cite .d{font-family:"Cascadia Mono",Consolas,monospace;font-size:var(--fs-11);color:var(--muted-2);flex:0 0 78px;}
  .cite.none{color:var(--muted-2);font-style:italic;}
  /* 引用来源超链接：蓝色、悬停/点击态 */
  .cite-link{
    color:var(--brand);text-decoration:none;border-radius:3px;padding:0 2px;transition:.12s;
  }
  .cite-link:hover{color:#1257c4;text-decoration:underline;background:var(--brand-soft);}
  .cite-link:active{color:#0d47a8;background:#d7e6fd;}
  .cite-link:focus-visible{outline:2px solid var(--brand);outline-offset:1px;}   /* 蓝色选中态 */
  .cite-link:visited{color:var(--brand);}
  /* 流式输出：正文先出，随后「引用与证据」自上而下逐条浮现 */
  .answer-card .cite-wrap{opacity:0;transform:translateY(5px);}
  .answer-card .cite-wrap.cite-shown{animation:citeIn .32s ease-out forwards;}
  .answer-card .cite-wrap.cite-shown .cite{animation:citeIn .28s ease-out both;}
  @keyframes citeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  .rv{padding:13px 14px;display:flex;flex-direction:column;gap:12px;}
  .rv-sec-label{font-size:var(--fs-11);color:var(--muted);letter-spacing:.4px;display:flex;align-items:center;gap:6px;}
  .dim{display:grid;grid-template-columns:118px 1fr auto;gap:8px;align-items:center;}
  .dim .dn{font-size:var(--fs-12);color:var(--text-2);}
  .dim .dn em{font-style:normal;color:var(--muted-2);font-size:var(--fs-11);margin-left:3px;}
  .scale{display:flex;gap:3px;}
  .scale button{
    width:24px;height:24px;border-radius:6px;border:1px solid var(--border-strong);background:#fff;cursor:pointer;
    font-size:var(--fs-12);color:var(--muted);transition:.1s;padding:0;
  }
  .scale button:hover{border-color:#b9c0c9;color:var(--text);}
  .scale button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:650;}
  .scale button.on.low{background:var(--danger);border-color:var(--danger);}
  .scale button.on.mid{background:var(--warn);border-color:var(--warn);}
  .total-mini{
    font-family:"Cascadia Mono",Consolas,monospace;font-size:var(--fs-12);font-weight:650;color:var(--text);
    background:var(--bg-sunken);border-radius:6px;padding:3px 7px;min-width:52px;text-align:center;
  }
  .total-mini.none{color:var(--muted-2);font-weight:400;}

  .tags{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{
    border:1px solid var(--border-strong);background:#fff;border-radius:999px;padding:3px 10px;font-size:var(--fs-12);
    cursor:pointer;color:var(--text-2);transition:.12s;
  }
  .tag:hover{border-color:#b9c0c9;}
  .tag.on{background:var(--danger-soft);border-color:#eeb4b1;color:var(--danger);font-weight:600;}

  .status-seg{display:flex;gap:6px;}
  .status-seg button{
    border:1px solid var(--border-strong);background:#fff;border-radius:7px;padding:4px 10px;font-size:var(--fs-12);
    cursor:pointer;color:var(--text-2);
  }
  .status-seg button.on{color:#fff;border-color:transparent;font-weight:600;}
  .status-seg button.on[data-s="none"]{background:var(--muted);}
  .status-seg button.on[data-s="doing"]{background:var(--warn);}
  .status-seg button.on[data-s="done"]{background:var(--ok);}

  .draft-note{font-size:var(--fs-11);color:var(--muted-2);}
  .draft-note.saved{color:var(--ok);}

  /* 评审状态 / 保存 / 清空：默认隐藏但仍占位可点击，进入「编辑评分」后显示 */
  .rv-actions{opacity:0;transition:opacity .16s;}
  .rv-actions.rv-ghost{opacity:0;}
  .rv-actions:not(.rv-ghost){opacity:1;}

  /* 锁定（已提交）后的评分控件 */
  .scale button[disabled],.tag[disabled]{opacity:.5;cursor:not-allowed;}
  .scale button[disabled]:hover{border-color:var(--border-strong);color:var(--muted);}
  .tag[disabled]:hover{border-color:var(--border-strong);}
  textarea.ctl[readonly]{background:var(--bg-soft);color:var(--text-2);}
  .btn[disabled]{opacity:.45;cursor:not-allowed;background:var(--bg-soft);}
  /* 主按钮禁用时要保留蓝色底，避免白字落在白底上看不见 */
  .btn.primary[disabled]{background:var(--brand);color:#fff;opacity:.55;}

  /* ---------------- 评审编辑弹窗 ---------------- */
  .modal-mask{
    position:fixed;inset:0;z-index:80;background:rgba(16,24,40,.38);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .modal{
    width:640px;max-width:100%;max-height:94vh;display:flex;flex-direction:column;
    background:#fff;border-radius:var(--r-lg);box-shadow:0 24px 60px rgba(16,24,40,.24);overflow:hidden;
  }
  .modal-head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--border);}
  .modal-head h3{margin:0;font-size:var(--fs-14);font-weight:650;}
  /* 弹窗主体不滚动：固定部分压缩，剩余空间给评语区自己滚 */
  .modal-body{
    flex:1 1 auto;min-height:0;overflow:hidden;padding:14px 18px 10px;
    display:flex;flex-direction:column;gap:9px;
  }
  .modal-q{
    flex:0 0 auto;background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--r-sm);
    padding:8px 12px;font-size:var(--fs-12);color:var(--text-2);line-height:1.55;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .modal-body .dim{gap:8px;}
  .modal-body .scale button{width:22px;height:22px;}
  .modal-tags{flex:0 0 auto;}
  /* 评语区：占满剩余高度并自带滚动条 */
  .modal-comment-wrap{
    flex:1 1 auto;min-height:88px;max-height:38vh;overflow:auto;
    border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;background:#fff;
  }
  .modal-comment-wrap:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
  .modal-comment-wrap textarea{
    width:100%;border:0;box-shadow:none;padding:0;resize:none;outline:none;background:transparent;
    font-size:var(--fs-13);line-height:1.6;min-height:64px;overflow:hidden;
  }
  .modal-foot{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:11px 18px;border-top:1px solid var(--border);background:var(--bg-soft);}
  /* 矮窗口下进一步压缩固定区，把空间留给评语滚动区 */
  @media (max-height:720px){
    .modal-body{gap:7px;padding:11px 16px 8px;}
    .modal-body .scale button{width:20px;height:20px;font-size:11px;}
    .modal-q{-webkit-line-clamp:1;}
    .modal-tags .tag{padding:2px 8px;font-size:11px;}
    .modal-comment-wrap{min-height:72px;}
  }

  /* 评审记录表：固定列宽，保证整行（含最右操作列）完整可见 */
  table.tbl.records{width:100%;table-layout:fixed;}
  table.tbl.records th,table.tbl.records td{overflow:hidden;text-overflow:ellipsis;}
  table.tbl.records td{height:48px;padding-top:6px;padding-bottom:6px;vertical-align:middle;}
  .cell-nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dims-compact{font-family:"Cascadia Mono",Consolas,monospace;font-size:12px;color:var(--text-2);white-space:nowrap;}
  .dims-compact b{font-weight:650;color:var(--text);}
  /* 评语列固定行高，超出截断 */
  .tbl td.comment-cell{max-width:260px;}
  .comment-clip{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    max-height:36px;line-height:18px;font-size:12px;color:var(--text-2);word-break:break-word;
  }
  /* 失败标签列：单行显示，超宽部分省略号截断，标签样式不变形 */
  .tbl td.tags-cell{overflow:hidden;}
  .tags-clip{
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    display:block;line-height:24px;max-height:24px;
  }
  .tags-clip .chip{display:inline-flex;max-width:100%;margin:0 4px 0 0;vertical-align:middle;}

  .mini-score{display:flex;align-items:center;gap:6px;font-size:var(--fs-12);color:var(--text-2);}
  .mini-score b{font-family:"Cascadia Mono",Consolas,monospace;}
  /* 未评完时隐藏卡片头部的总分，避免与「未评审」状态重复 */
  .mini-score.total-none{visibility:hidden;}

  /* ---------------- 对话评审 ---------------- */
  .mchip{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);background:#fff;border-radius:999px;
    padding:4px 11px;font-size:var(--fs-12);cursor:pointer;color:var(--muted);transition:.12s;
  }
  .mchip:hover{border-color:#b9c0c9;color:var(--text);}
  .mchip.on{background:var(--bg-soft);border-color:#ccd2d9;color:var(--text);font-weight:600;}
  .mchip .dot{opacity:.28;}
  .mchip.on .dot{opacity:1;}
  .mchip .x{margin-left:3px;color:var(--muted-2);font-size:11px;line-height:1;}
  .mchip .x:hover{color:var(--danger);}

  .hello{text-align:center;padding:26px 8px 6px;}
  .hello-mark{
    width:46px;height:46px;border-radius:15px;background:linear-gradient(140deg,#1f6feb,#5b8def);color:#fff;
    font-size:23px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;
  }
  .hello h2{margin:0 0 6px;font-size:var(--fs-22);font-weight:650;}
  .hello p{margin:0;color:var(--muted);font-size:var(--fs-13);}

  .qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px;}
  @media (max-width:1120px){.qgrid{grid-template-columns:1fr;}}
  .qcard{
    text-align:left;border:1px solid var(--border);background:#fff;border-radius:var(--r-md);padding:12px 14px;
    cursor:pointer;transition:.14s;display:flex;flex-direction:column;gap:7px;
  }
  .qcard:hover{border-color:#bcd0f2;background:#fbfcff;box-shadow:var(--shadow);transform:translateY(-1px);}
  .qcard.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
  .qcard-top{display:flex;align-items:center;gap:8px;}
  .qnum{

  .mopt.add{color:var(--brand);font-weight:600;justify-content:center;font-size:var(--fs-13);}

    display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;border-radius:7px;

  .sec-title{font-size:var(--fs-13);font-weight:650;margin:20px 0 10px;display:flex;align-items:center;gap:8px;}
  .sec-title:first-child{margin-top:0;}
  .sec-title .line{flex:1;height:1px;background:var(--border);}

  .empty{text-align:center;padding:34px 20px;color:var(--muted);font-size:var(--fs-13);}
  .empty .big{font-size:26px;display:block;margin-bottom:8px;opacity:.5;}

  .banner{
    display:flex;align-items:center;gap:10px;background:var(--warn-soft);border:1px solid #f0dcb6;color:#7d5406;
    border-radius:var(--r-md);padding:9px 13px;font-size:var(--fs-12);margin-bottom:14px;
  }
  .banner.info{background:var(--brand-soft);border-color:#cfe0fb;color:#1a4f9c;}
  .banner .spacer{flex:1;}

  .prose{font-size:var(--fs-13);line-height:1.8;color:var(--text-2);max-width:900px;}
  .prose h3{font-size:var(--fs-14);color:var(--text);margin:22px 0 8px;}
  .prose h3:first-child{margin-top:0;}
  .prose code{background:var(--bg-sunken);border-radius:4px;padding:1px 5px;font-family:"Cascadia Mono",Consolas,monospace;font-size:var(--fs-12);}
  .prose ul{margin:6px 0;padding-left:20px;}
  .prose li{margin:3px 0;}

  .toast-wrap{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:99;}
  .toast{
    background:#14171a;color:#fff;border-radius:9px;padding:9px 14px;font-size:var(--fs-13);
    box-shadow:0 8px 24px rgba(0,0,0,.18);animation:pop .22s ease-out;
  }
  .toast.err{background:var(--danger);}
  @keyframes pop{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .add-form{background:var(--bg-soft);border:1px dashed var(--border-strong);border-radius:var(--r-md);padding:12px;margin-bottom:14px;}
  .add-form .fields{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:start;}
  @media (max-width:760px){.add-form .fields{grid-template-columns:1fr;}}
  .lbl{font-size:var(--fs-12);color:var(--muted);margin-bottom:4px;display:block;}
  .mono-sm{font-family:"Cascadia Mono",Consolas,monospace;font-size:var(--fs-11);color:var(--muted-2);}
</style>
</head>

function streamInto(el, full, cursor, delayMs, onDone) {
  const cps = STREAM_SPEEDS[state.stream] === undefined ? STREAM_SPEEDS.medium : STREAM_SPEEDS[state.stream];
  if (!full) { el.textContent = ""; if (cursor) cursor.style.display = "none"; if (onDone) onDone(); return; }
  if (!isFinite(cps) || cps <= 0) { el.textContent = full; if (cursor) cursor.style.display = "none"; if (onDone) onDone(); return; }

  const id = setInterval(() => {
    const elapsed = (now() - startAt) / 1000;
    if (elapsed <= 0) return;
    const n = Math.min(full.length, Math.floor(elapsed * cps));
    if (n > el.textContent.length) el.textContent = full.slice(0, n);
    if (n >= full.length) {

      if (cursor) cursor.style.display = "none";

    const key = el.getAttribute("data-stream");
    const full = streamTexts[key] || "";
    const card = el.closest(".answer-card");
    const cursor = card ? card.querySelector(".cursor") : null;
    const reveal = () => revealCitations(card);
    if (el.getAttribute("data-anim") !== "1") {   // 已播放过的回答：直接显示，不重复动画
      el.textContent = full;
      if (cursor) cursor.style.display = "none";
      reveal();
      return;
    }
    state.chat.animated[key] = true;
    /* 正文先流式输出，结束后再浮现「引用与证据」——自上而下依次覆盖 */
    streamInto(el, full, cursor, Number(el.getAttribute("data-delay") || 0), reveal);
  });
}
function replayAnswer(id) {
  const el = document.querySelector('[data-stream="' + id + '"]');
  if (!el) return;
  const card = el.closest(".answer-card");
  el.textContent = "";
  const wrap = card ? card.querySelector(".cite-wrap") : null;
  if (wrap) wrap.classList.remove("cite-shown");
  streamInto(el, streamTexts[id] || "", card ? card.querySelector(".cursor") : null, 0,
    () => revealCitations(card));
}

/* ------------------------------ 通用 UI ------------------------------ */
function toast(msg, isErr) {

  const d = document.createElement("div");

  d.textContent = msg;
  w.appendChild(d);
  setTimeout(() => { d.style.opacity = "0"; d.style.transition = "opacity .3s"; }, 1900);
  setTimeout(() => d.remove(), 2300);
}
const icon = k => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[k] || "") + "</svg>";
const chip = (text, cls) => '<span class="chip ' + (cls || "") + '">' + text + "</span>";
const modelDot = m => '<span class="dot" style="background:' + m.color + '"></span>';

/* ------------------------------ 侧边栏 / 顶栏 ------------------------------ */

        "</span>").join("") + "</div>";
  }

  /* 最近评审：只记录评审模式下的提问，日常对话不进入 */

      }).join("");
  }

  /* 完成进度只统计提问过的问题与其当时选中的模型：没有提问时为 0 / 0 */
  const st = progressStats();
  document.getElementById("progText").textContent = st.done + " / " + st.total;
  document.getElementById("progBar").style.width = (st.total ? (st.done / st.total * 100) : 0) + "%";
}
/* 进度口径：各会话中每轮评审的问题 × 该轮选中的模型（去重） */
function progressStats() {
  const perCase = {};
  state.chat.sessions.forEach(s => (s.rounds || []).forEach(r => {
    if (!r || r.kind === "chat" || !r.caseId) return;
    const bag = perCase[r.caseId] = perCase[r.caseId] || {};
    (r.modelIds || []).forEach(id => { bag[id] = true; });
  }));
  let total = 0, done = 0;
  Object.keys(perCase).forEach(cid => {
    Object.keys(perCase[cid]).forEach(mid => {
      total++;
      if (getReview(cid, mid).status === "done") done++;
    });
  });
  return { total: total, done: done };
}
function navCount(key) {
  if (key === "records") {
    const n = allReviews().filter(hasAnyReviewContent).length;
    return n ? '<span class="cnt">' + n + "</span>" : "";
  }
  return "";
}

/* ------------------------------ 视图：对话评审 ------------------------------ */
function caseById(caseId) { return state.cases.find(c => c.case_id === caseId) || null; }
function caseIndex(caseId) { return state.cases.findIndex(c => c.case_id === caseId); }
/* 界面上只用「主题 / 问题摘要」，内部编号只出现在导出 JSON 里 */
function caseLabel(caseId) {
  const c = caseById(caseId);
  if (!c) return "一条提问";
  if (c.title) return c.title;
  const q = String(c.question || "");
  return q.length > 14 ? q.slice(0, 14) + "…" : q || "自由提问";
}
/* 参考问题 = 内置的、带参考答案的问题；自由提问不进这个列表 */
function referenceCases() { return state.cases.filter(c => !c.free); }

function allModels() { return MODELS.concat(state.chat.customModels); }
function modelOf(id) {
  return allModels().find(m => m.id === id) || { id: id, name: id, short: id, vendor: "", color: "#8a8f98" };
}
function activeModels() {
  const on = state.chat.active;
  return allModels().filter(m => on.indexOf(m.id) >= 0);
}
function reviewProgress(caseId) {
  const as = answersOf(caseId);
  return { done: as.filter(a => getReview(caseId, a.model_id).status === "done").length, total: as.length };
}

function renderChat() {
  streamTexts = {};
  let h = "";

function askedCaseIds() {

/* ---- 单轮对话 ---- */
const DAILY_REPLY = "你好，我是金融 Agent 评测竞技场，选中输入框中的评审按钮，即可开启各大模型的评审噢~";
function renderRound(rd, idx) {
  if (rd.kind === "chat") return renderChatRound(rd, idx);   // 日常对话轮
  const c = caseById(rd.caseId);
  if (!c) return "";
  const expanded = isExpanded(idx);
  if (!expanded) return collapsedRound(rd, idx, c);

  const ids = rd.modelIds.filter(id => allModels().some(m => m.id === id));
  const answers = ids.map(id => answersOf(rd.caseId).find(a => a.model_id === id)).filter(Boolean);
  const pending = ids.filter(id => !answers.some(a => a.model_id === id));
  const doneN = ids.filter(id => getReview(rd.caseId, id).status === "done").length;

  let h = '<div class="round" id="round-' + idx + '" data-case="' + esc(rd.caseId) + '">';

  /* 用户气泡 */
  h += '<div class="msg-user"><div class="bubble">' + esc(c.question) + "</div>" +
    '<div class="msg-meta">' + (c.free ? chip("自由提问") : "") +
    "<span>" + ids.length + " 个模型作答 · " + shortTime(rd.askedAt) + "</span>" +
    '<span class="chip">本轮进度 ' + doneN + " / " + ids.length + "</span>" +
    '<button class="btn ghost sm" data-act="collapse-round" data-idx="' + idx + '">收起</button>' +
    '<button class="btn ghost sm" data-act="export-case" data-case="' + esc(rd.caseId) + '">导出本轮</button>' +
    "</div></div>";

  /* 并行作答 */
  h += '<div class="answers">' +
    answers.map(a => answerCard(c, a, idx)).join("") +
    pending.map(id => pendingCard(c, id)).join("") +
    "</div>";
  h += "</div>";
  return h;
}
/* 日常对话轮：固定回复，不进入评审 */
function renderChatRound(rd, idx) {
  const expanded = isExpanded(idx);
  if (!expanded) {
    return '<div class="card round-head" data-act="expand-round" data-idx="' + idx + '">' +
      '<span class="qtag">日常对话</span>' +
      '<span class="rh-q">' + esc(String(rd.text || "").slice(0, 40)) + '</span>' +

function collapsedRound(rd, idx, c) {
  const ids = rd.modelIds.filter(id => allModels().some(m => m.id === id));

  }).join("");

    '<span class="qtag">' + esc(c.free ? "自由提问" : (c.title || "参考问题")) + "</span>" +
    '<span class="rh-q">' + esc((c.question || "").slice(0, 46)) + "…</span>" +
    '<span class="spacer"></span>' + chips +

/* 未录入回答的模型：粘贴后即可流式作答并评分 */

function renderBottomBar() {

function answerCard(c, a, roundIdx) {
  const m = modelOf(a.model_id);
  const key = "ans_" + a.id.replace(/[^a-zA-Z0-9]/g, "_");
  streamTexts[key] = a.answer;
  const r = getReview(c.case_id, a.model_id);
  const total = reviewTotal(r);
  const editing = state.chat.editing === key;   // 「编辑评分」模式
  const submitted = r.status === "done";        // 已提交
  const locked = submitted && !editing;         // 未提交的问题默认即可编辑；已提交需点 ✎ 解锁
  const anim = !state.chat.animated[key];
  const order = (c && roundIdx !== undefined) ? state.chat.rounds[roundIdx].modelIds.indexOf(a.model_id) : 0;

  let h = '<div class="card answer-card" data-answer="' + esc(a.id) + '" data-case="' + esc(c.case_id) + '" data-model="' + esc(a.model_id) + '" data-editing="' + (editing ? "1" : "0") + '">';
  h += '<div class="ac-head">' + modelDot(m) +
    '<span class="ac-name">' + esc(m.name) + "</span>" +
    (m.baseline ? chip("基准", "brand") : (m.vendor ? chip(esc(m.vendor)) : "")) +
    (editing ? chip("评分编辑中", "brand") : "") +
    '<span class="spacer"></span>' +
    /* 未评完时不显示总分，避免与状态「未评审」重复；评完/已提交才显示分数 */
    '<span class="mini-score' + (total === null ? " total-none" : "") + '" data-totalwrap="' + esc(a.model_id) + '"><b data-total="' + esc(a.model_id) + '">' + (total === null ? "未评完" : fmt1(total)) + "</b></span>" +
    statusChip(r.status) +
    '<button class="btn ghost sm" data-act="replay" data-answer="' + esc(a.id) + '" title="重新生成">↻</button>' +
    '<button class="btn ghost sm" data-act="edit-score" data-answer="' + esc(a.id) + '" title="编辑评分">✎</button>' +
    '<button class="btn ghost sm danger" data-act="del-answer" data-answer="' + esc(a.id) + '" data-custom="' + (a.custom ? "1" : "0") + '" title="删除该回答">✕</button>' +
  "</div>";

  /* 回答正文（不可编辑） */
  h += '<div class="ac-body"><div class="ans-text"><span data-stream="' + key + '" data-anim="' + (anim ? "1" : "0") + '" data-delay="' + (anim ? order * STREAM_STAGGER_MS : 0) + '"></span><span class="cursor"></span></div>';
  h += '<div class="cite-wrap"><div class="cite-title">引用与证据（' + (a.citations || []).length + "）</div>";
  if (!a.citations || !a.citations.length) h += '<div class="cite none">未提供任何引用来源</div>';
  else h += (a.citations || []).map(x =>
    '<div class="cite"><span class="d">' + esc(x.published_at || "无日期") + "</span>" +
    '<a class="cite-link" href="#" title="在浏览器中打开该来源">' + esc(x.title) + " · " + esc(x.org || "未知来源") + "</a></div>").join("");
  h += '<div class="cite-title" style="margin-top:8px">回答生成于 ' + esc(shortTime(a.generated_at)) +

  /* 操作行：保存评审 / 提交评审 / 清空评分 同一行；评审状态（未评审/评审中/已完成）不在卡片上展示 */
  const canSubmit = !submitted || editing;

function askedEmptyState() {
  return '<div class="empty"><span class="big">◻</span>还没有提问。<br>' +
    '<span class="hint">去「对话评审」选一个参考问题或直接输入你的问题，评审记录会出现在这里。</span></div>';
}
function reviewRows() {
  const f = state.filters;
  const out = [];
  askedCases().forEach(c => {
    answersOf(c.case_id).forEach(a => {
      const r = getReview(c.case_id, a.model_id);
      out.push({ c, a, r });
    });
  });
  return out.filter(x => {
    if (f.caseId !== "all" && x.c.case_id !== f.caseId) return false;
    if (f.modelId !== "all" && x.a.model_id !== f.modelId) return false;
    if (f.status !== "all" && x.r.status !== f.status) return false;
    if (f.label !== "all" && x.r.failures.indexOf(f.label) < 0) return false;
    return true;
  }).sort((p, q) => (p.c.case_id < q.c.case_id ? -1 : p.c.case_id > q.c.case_id ? 1 : p.a.model_id < q.a.model_id ? -1 : 1));
}

function saveReviewModal() {
  const m = state.modal;

/* ------------------------------ 聚合计算 ------------------------------ */
function aggregate(caseId) {
  const scope = solvedReviews().filter(r => caseId === "all" || r.case_id === caseId);
  const byModel = {};
  allModels().forEach(m => {
    const rs = scope.filter(r => r.model_id === m.id);
    const dims = {};
    DIMENSIONS.forEach(d => {
      dims[d.key] = rs.length ? rs.reduce((s, r) => s + r.scores[d.key], 0) / rs.length : null;
    });
    byModel[m.id] = {
      model: m, n: rs.length,
      avg: rs.length ? rs.reduce((s, r) => s + reviewTotal(r), 0) / rs.length : null,
      dims,
      labels: countLabels(rs)
    };
  });
  return { byModel, n: scope.length };
}
function countLabels(rs) {
  const c = {}; FAILURE_LABELS.forEach(l => c[l.key] = 0);
  rs.forEach(r => r.failures.forEach(k => { if (c[k] === undefined) c[k] = 0; c[k]++; }));
  return c;
}
function countStatus() {
  const c = { none: 0, doing: 0, done: 0 };
  askedCases().forEach(cs => answersOf(cs.case_id).forEach(a => { c[getReview(cs.case_id, a.model_id).status]++; }));
  return c;
}

function dimGroupedChart(agg, ranked) {
  const W = 760, H = 260, padL = 34, padB = 34, padT = 14, padR = 10;
  const gw = (W - padL - padR) / DIMENSIONS.length;
  const innerH = H - padT - padB;
  const y = v => padT + innerH * (1 - v / MAX_DIM_SCORE);
  let s = '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;height:auto">';
  for (let v = 0; v <= MAX_DIM_SCORE; v++) {
    s += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#eef0f3"/>' +
      '<text x="' + (padL - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="10" fill="#9aa1a9">' + v + "</text>";
  }
  DIMENSIONS.forEach((d, i) => {
    const x0 = padL + gw * i + 14;
    const bw = (gw - 28) / MODELS.length;
    MODELS.forEach((m, j) => {
      const v = agg.byModel[m.id].dims[d.key];
      if (v === null) return;
      const hh = innerH * (v / MAX_DIM_SCORE);
      s += '<rect x="' + (x0 + bw * j + 2) + '" y="' + (padT + innerH - hh) + '" width="' + (bw - 4) + '" height="' + hh + '" fill="' + m.color + '" opacity="' + (m.baseline ? 0.95 : 0.72) + '" rx="3"/>';
    });
    s += '<text x="' + (padL + gw * i + gw / 2) + '" y="' + (H - 12) + '" text-anchor="middle" font-size="11" fill="#41474d">' + d.name + "</text>";
  });
  s += "</svg>";
  s += '<div class="row" style="justify-content:center;margin-top:4px">' + MODELS.map(m =>
    '<span class="mini-score">' + modelDot(m) + esc(m.name) + "</span>").join("") + "</div>";

function labelBars(counts, title) {

      '<span class="num" style="font-size:12px">' + v + "</span></div>";

  return s;
}

function buildExport(scope, caseId) {
  const cases = scope === "case" ? state.cases.filter(c => c.case_id === caseId) : state.cases;
  const ids = new Set(cases.map(c => c.case_id));
  const answers = scope === "case"
    ? ids.size ? [...ids].flatMap(id => answersOf(id)) : []
    : state.cases.flatMap(c => answersOf(c.case_id));
  const reviews = Object.values(state.reviews)
    .filter(r => scope !== "case" || ids.has(r.case_id))
    .filter(r => hasAnyReviewContent(r) || r.status !== "none");
  const out = {
    schema: SCHEMA_ID,
    exported_at: new Date().toISOString(),
    scope: scope === "case" ? "case:" + caseId : scope,
    config: {
      dimensions: DIMENSIONS,
      failure_labels: FAILURE_LABELS,
      stream: state.stream
    },
    models: MODELS,
    cases, answers, reviews
  };
  if (scope === "reviews") return { schema: SCHEMA_ID, exported_at: out.exported_at, reviews };
  if (scope === "answers") return { schema: SCHEMA_ID, exported_at: out.exported_at, models: MODELS, cases, answers };
  return out;
}
function downloadJSON(obj, name) {
  downloadFile(JSON.stringify(obj, null, 2), name, "application/json");
}
/* 通用下载：优先用 data URL。
   本地 file:// 打开时，Chrome 对 blob: URL 的下载常会被拦住或卡在 0 B/s，
   data URL + download 属性能立刻弹出下载；失败再退回 blob。 */
function downloadFile(text, name, mime) {
  const type = (mime || "text/plain") + ";charset=utf-8";
  const a = document.createElement("a");
  a.style.display = "none";
  a.rel = "noopener";
  a.download = name;
  document.body.appendChild(a);
  let ok = false;
  try {
    a.href = "data:" + type + ";base64," + utf8ToBase64(text);
    a.click();
    ok = true;
  } catch (e) { ok = false; }
  if (!ok) {
    try {
      const url = URL.createObjectURL(new Blob([text], { type: type }));
      a.href = url;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (e2) { toast("下载失败，可到「数据导入导出」页复制内容", true); }
  }
  setTimeout(() => { try { a.remove(); } catch (e) {} }, 0);
}
/* 先按 UTF-8 编码再 base64，保证中文文件名与内容不乱码 */
function utf8ToBase64(str) {
  let bytes;
  if (typeof TextEncoder !== "undefined") bytes = new TextEncoder().encode(str);
  else bytes = unescape(encodeURIComponent(str)).split("").map(function (c) { return c.charCodeAt(0); });
  let bin = "";
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.length === undefined ? [] :
      (bytes.subarray ? bytes.subarray(i, i + chunk) : bytes.slice(i, i + chunk)));
  }
  return btoa(bin);
}
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => toast("已复制到剪贴板"), () => fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("已复制到剪贴板"); } catch (e) { toast("复制失败，请手动选择文本", true); }
  ta.remove();
}
function importData(obj, opts) {
  if (!obj || typeof obj !== "object") { toast("导入失败：不是有效的 JSON 对象", true); return; }
  let ok = [];
  if (Array.isArray(obj.cases) && obj.cases.length) {
    if (opts.replace) state.cases = obj.cases; else {
      const map = Object.fromEntries(state.cases.map(c => [c.case_id, c]));
      obj.cases.forEach(c => map[c.case_id] = c);
      state.cases = Object.values(map);
    }
    persistCases(); ok.push(obj.cases.length + " 题");
  }
  if (Array.isArray(obj.answers) && obj.answers.length) {
    const incoming = obj.answers.map(a => Object.assign({}, a, { custom: true }));
    if (opts.replace) {
      state.answersStore.custom = incoming;
      state.answersStore.deleted = [];
    } else {
      const ids = new Set(incoming.map(a => a.id));
      state.answersStore.custom = state.answersStore.custom.filter(a => !ids.has(a.id)).concat(incoming);
      state.answersStore.deleted = state.answersStore.deleted.filter(id => !ids.has(id));
    }
    persistAnswers(); ok.push(obj.answers.length + " 条回答");
  }
  if (opts.reviews && Array.isArray(obj.reviews) && obj.reviews.length) {
    let n = 0;
    obj.reviews.forEach(r => {
      if (!r || !r.case_id || !r.model_id) return;
      const base = blankReview(r.case_id, r.model_id);
      DIMENSIONS.forEach(d => {
        const v = r.scores ? r.scores[d.key] : null;
        base.scores[d.key] = (v === null || v === undefined) ? null : Math.max(0, Math.min(MAX_DIM_SCORE, Number(v)));
      });
      base.failures = Array.isArray(r.failures) ? r.failures.slice() : [];
      base.comment = r.comment || "";
      base.status = TO_LABEL[r.status] ? r.status : "none";
      base.reviewed_at = r.reviewed_at || null;
      base.updated_at = r.updated_at || null;
      base.demo = false;
      state.reviews[keyOf(r.case_id, r.model_id)] = base;
      n++;
    });
    persistReviews(); ok.push(n + " 条评审记录");
  }
  if (obj.config && obj.config.stream && STREAM_SPEEDS[obj.config.stream] !== undefined) {
    state.stream = obj.config.stream; persistConfig();
  }
  if (ok.length) toast("导入成功：" + ok.join("、")); else toast("未从该 JSON 中识别到可导入的数据", true);
  renderAll();
}

function refreshCard(caseId, modelId) {
  const card = document.querySelector('.answer-card[data-case="' + caseId + '"][data-model="' + modelId + '"]');
  if (!card) { renderView(); return; }
  const r = getReview(caseId, modelId);
  card.querySelectorAll(".scale button").forEach(b => {
    const dim = b.getAttribute("data-dim");
    const v = Number(b.getAttribute("data-v"));
    const on = r.scores[dim] === v;
    b.classList.toggle("on", on);
    b.classList.remove("low", "mid");
    if (on && scoreClass(v)) b.classList.add(scoreClass(v));
  });
  DIMENSIONS.forEach(d => {
    const el = card.querySelector('[data-dimval="' + modelId + "_" + d.key + '"]');
    if (!el) return;
    const v = r.scores[d.key];
    el.textContent = v === null ? "—" : String(v);
    el.classList.toggle("none", v === null);
  });
  const total = reviewTotal(r);
  const tEl = card.querySelector('[data-total="' + modelId + '"]');
  if (tEl) tEl.textContent = total === null ? "未评完" : fmt1(total);
  const tw = card.querySelector('[data-totalwrap="' + modelId + '"]');
  if (tw) tw.classList.toggle("total-none", total === null);   // 未评完时隐藏头部总分
  const tEl2 = card.querySelector('[data-dimtotal="' + modelId + '"]');
  if (tEl2) { tEl2.textContent = total === null ? "未评完" : fmt1(total); tEl2.classList.toggle("none", total === null); }
  card.querySelectorAll(".tag").forEach(b => b.classList.toggle("on", r.failures.indexOf(b.getAttribute("data-tag")) >= 0));
  card.querySelectorAll(".status-seg button").forEach(b => b.classList.toggle("on", b.getAttribute("data-s") === r.status));
  const dEl = card.querySelector('[data-draft="' + modelId + '"]');
  if (dEl) { dEl.textContent = r.demo ? "演示记录" : (r.updated_at ? "已自动保存 " + shortTime(r.updated_at) : "未保存"); }
  refreshRoundMeta(caseId);
}
/* 同步本轮进度与收起态的模型总分 */
function refreshRoundMeta(caseId) {
  const idx = state.chat.rounds.findIndex(rd => rd.caseId === caseId);
  if (idx < 0) return;
  const rd = state.chat.rounds[idx];
  const ids = rd.modelIds.filter(id => allModels().some(m => m.id === id));
  const box = document.getElementById("round-" + idx);
  if (box) {
    const chipEl = box.querySelector(".msg-meta .chip");
    if (chipEl) chipEl.textContent = "本轮进度 " + ids.filter(id => getReview(caseId, id).status === "done").length + " / " + ids.length;
  }
  document.querySelectorAll('.round-head[data-idx="' + idx + '"]').forEach(head => {
    head.querySelectorAll(".mini-score b").forEach((b, i) => {
      const id = ids[i]; if (!id) return;
      const t = reviewTotal(getReview(caseId, id));
      b.textContent = t === null ? "—" : fmt1(t);
    });
  });
  const rq = document.querySelector('.rq-item[data-idx="' + idx + '"] .rq-n');
  if (rq) { const p = reviewProgress(caseId); rq.textContent = p.done + "/" + Math.max(p.total, ids.length); }
}

  pruneEmpty(caseId, modelId);
  persistReviews();
  refreshCard(caseId, modelId);
  renderSidebar();
}
/* 评分锁定：已提交的记录默认锁定，点卡片右上角 ✎ 进入编辑评分后解锁 */
function isEditingCard(caseId, modelId) {
  const card = document.querySelector('.answer-card[data-case="' + caseId + '"][data-model="' + modelId + '"]');
  return !!(card && card.getAttribute("data-editing") === "1");
}
function scoreLocked(caseId, modelId) {
  return getReview(caseId, modelId).status === "done" && !isEditingCard(caseId, modelId);
}
function setScore(caseId, modelId, dim, v) {
  if (scoreLocked(caseId, modelId)) { toast("该评审已提交，如需修改请到「评审记录」中编辑", true); return; }
  const r = ensureReview(caseId, modelId);
  r.scores[dim] = (r.scores[dim] === v) ? null : v;
  if (r.status === "none" && hasAnyReviewContent(r)) r.status = "doing";
  touch(r, caseId, modelId);
}
function toggleTag(caseId, modelId, tag) {
  if (scoreLocked(caseId, modelId)) { toast("该评审已提交，如需修改请到「评审记录」中编辑", true); return; }
  const r = ensureReview(caseId, modelId);
  const i = r.failures.indexOf(tag);
  if (i >= 0) r.failures.splice(i, 1); else r.failures.push(tag);
  if (r.status === "none") r.status = "doing";
  touch(r, caseId, modelId);
}
function setStatus(caseId, modelId, s) {
  const r = ensureReview(caseId, modelId);
  r.status = s;
  if (s === "done") {
    r.reviewed_at = r.reviewed_at || new Date().toISOString();
    const missing = DIMENSIONS.filter(d => r.scores[d.key] === null).map(d => d.name);
    if (missing.length) toast("已标记完成，但以下维度未打分：" + missing.join("、"), true);
  }
  touch(r, caseId, modelId);
}
function saveReview(caseId, modelId) {
  const r = ensureReview(caseId, modelId);
  r.status = r.status === "none" ? "doing" : r.status;
  r.reviewed_at = new Date().toISOString();
  r.updated_at = r.reviewed_at;
  r.demo = false;
  persistReviews();
  refreshCard(caseId, modelId);
  renderSidebar();
  const t = reviewTotal(r);
  toast("已保存：" + caseLabel(caseId) + " / " + modelOf(modelId).name + " · " + (t === null ? "未评完" : "总分 " + fmt1(t)));
}
function resetReview(caseId, modelId) {
  delete state.reviews[keyOf(caseId, modelId)];
  persistReviews();
  refreshCard(caseId, modelId);
  renderSidebar();
  toast("已清空该回答的评分");
}
function deleteAnswer(caseId, modelId, answerId, isCustom) {
  if (!window.confirm("确认删除该回答？删除后它的评审记录也会一并移除。")) return;
  if (isCustom) state.answersStore.custom = state.answersStore.custom.filter(a => a.id !== answerId);
  else if (state.answersStore.deleted.indexOf(answerId) < 0) state.answersStore.deleted.push(answerId);
  delete state.reviews[keyOf(caseId, modelId)];
  /* 同时把该模型移出本轮，避免删掉后立刻又变成「等待回答」卡片 */
  state.chat.rounds.forEach(rd => {
    if (rd.caseId === caseId) rd.modelIds = rd.modelIds.filter(id => id !== modelId);
  });
  persistChat(); persistAnswers(); persistReviews();
  renderView(); renderSidebar();
  toast("已删除 " + modelOf(modelId).name + " 的回答");
}
/* 粘贴/修改回答：写入自定义层（同 id 覆盖内置层，可在数据页整体还原） */
function putAnswer(caseId, modelId, text, citations) {
  const id = caseId + "::" + modelId;
  const answer = {
    id: id, case_id: caseId, model_id: modelId, answer: text,
    citations: citations || [], generated_at: new Date().toISOString(), custom: true
  };
  const i = state.answersStore.custom.findIndex(a => a.id === id);
  if (i >= 0) state.answersStore.custom[i] = answer; else state.answersStore.custom.push(answer);
  const d = state.answersStore.deleted.indexOf(id);
  if (d >= 0) state.answersStore.deleted.splice(d, 1);
  persistAnswers();
  delete state.chat.animated["ans_" + id.replace(/[^a-zA-Z0-9]/g, "_")];   // 新内容重新播放一次
}
function parseCitations(text) {
  return (text || "").split("\n").map(l => l.trim()).filter(Boolean).map(l => {
    const p = l.split("|").map(s => s.trim());
    return { title: p[0] || "未命名来源", org: p[1] || "", published_at: p[2] || "" };
  });
}
/* 提问：选中的模型并行作答（错峰起笔） */
function askQuestion(caseId) {
  const ids = activeModels().map(m => m.id);
  if (!ids.length) { toast("请至少选择一个模型", true); return; }
  const c = caseById(caseId);
  if (!c) { toast("没有找到这条问题，请重新输入", true); return; }
  let idx = state.chat.rounds.findIndex(rd => rd.caseId === caseId);
  if (idx >= 0) {
    state.chat.rounds[idx].modelIds = ids;
    state.chat.rounds[idx].askedAt = new Date().toISOString();
  } else {
    state.chat.rounds.push({ caseId: caseId, modelIds: ids, askedAt: new Date().toISOString() });
    idx = state.chat.rounds.length - 1;
  }
  const sess = currentSession();
  if (sess && (!sess.title || sess.title === "新会话")) sess.title = String(c.question || "新会话").slice(0, 14);
  if (state.chat.expandedRounds.indexOf(idx) < 0) state.chat.expandedRounds.push(idx);
  state.chat.selected = null;
  state.chat.showPicker = false;
  persistChat();
  renderSidebar();
  renderView();
  const el = document.getElementById("round-" + idx);
  if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "start" });
  toast(ids.length + " 个模型正在作答");
}
/* 日常对话：不触发评审，固定回复 */
function askDaily(text) {
  state.chat.rounds.push({ kind: "chat", text: text, askedAt: new Date().toISOString() });
  const idx = state.chat.rounds.length - 1;
  if (state.chat.expandedRounds.indexOf(idx) < 0) state.chat.expandedRounds.push(idx);
  state.chat.selected = null;
  state.chat.showPicker = false;
  state.chat.modelPopOpen = false;
  const sess = currentSession();
  if (sess && (!sess.title || sess.title === "新会话")) sess.title = String(text).slice(0, 14);
  persistChat();
  renderSidebar();
  renderView();
  const el = document.getElementById("round-" + idx);
  if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "start" });
}
function normText(s) {
  return String(s || "").replace(/[\s，。？！、,.;；:：""''（）()【】\[\]《》<>—\-_]/g, "");
}
function matchCase(text) {
  const t = normText(text);
  if (t.length < 4) return null;
  for (const c of state.cases) {
    const q = normText(c.question);
    if (q === t) return c;
  }
  for (const c of state.cases) {
    const q = normText(c.question);
    if (q.indexOf(t) >= 0) return c;
    if (t.indexOf(q) >= 0) return c;
  }
  return null;
}
/* 自由提问：没有内置参考答案，评分以评审人判断为准 */
function createFreeQuestion(question) {
  const text = String(question || "").trim();
  const id = "free_" + Date.now().toString(36);
  const short = text.length > 16 ? text.slice(0, 16) + "…" : text;
  state.cases.push({
    case_id: id, title: short, question: text,
    reference_answer: "", reference_values: [], allowed_evidence: [],
    cutoff_at: "", risk_labels: [], focus: "", free: true
  });
  persistCases();
  toast("已加入一条自由提问（无内置参考答案，按你的判断评分）");
  return id;
}
/* ------------------------------ 报告文本 ------------------------------ */
function leaderboardMarkdown() {
  const agg = aggregate(state.leaderboardCase === "all" ? "all" : state.leaderboardCase);
  const ranked = MODELS.map(m => ({ m, s: agg.byModel[m.id] }))
    .sort((a, b) => (b.s.avg === null ? -1 : b.s.avg) - (a.s.avg === null ? -1 : a.s.avg));
  const scope = state.leaderboardCase === "all" ? "全部问题" : caseLabel(state.leaderboardCase);
  let md = "# 金融 Agent 评测排行榜（" + scope + "）\n\n样本：" + agg.n + " 条已完成记录\n\n";
  md += "| 排名 | 模型 | 题均总分 | " + DIMENSIONS.map(d => d.name + "(" + Math.round(d.weight * 100) + "%)").join(" | ") + " | 覆盖题数 |\n";
  md += "|---|---|---|" + DIMENSIONS.map(() => "---").join("|") + "|---|\n";
  ranked.forEach((x, i) => {
    md += "| " + (i + 1) + " | " + x.m.name + " | " + (x.s.avg === null ? "—" : fmt1(x.s.avg)) + " | " +
      DIMENSIONS.map(d => x.s.dims[d.key] === null ? "—" : fmt2(x.s.dims[d.key])).join(" | ") + " | " + x.s.n + " |\n";
  });
  return md;
}
function reportMarkdown() {
  const asked = askedCases();
  const agg = aggregate("all");
  const st = countStatus();
  const totalAns = asked.reduce((s, c) => s + answersOf(c.case_id).length, 0);
  const all = countLabels(allReviews().filter(hasAnyReviewContent));
  let md = "# 金融 Agent 评测汇总报告\n\n";
  md += "生成时间：" + new Date().toLocaleString("zh-CN") + "\n\n";
  md += "- 问题数：" + asked.length + "\n- 回答数：" + totalAns + "\n- 已完成评审：" + st.done + "\n- 完成率：" +
    (totalAns ? (st.done / totalAns * 100).toFixed(0) : 0) + "%\n\n";
  md += "## 各模型汇总\n\n| 模型 | 题均总分 | 覆盖问题数 | " + DIMENSIONS.map(d => d.name).join(" | ") + " | 失败标签数 |\n";
  md += "|---|---|---|" + DIMENSIONS.map(() => "---").join("|") + "|---|\n";
  allModels().forEach(m => {
    const s = agg.byModel[m.id];
    md += "| " + m.name + " | " + (s.avg === null ? "—" : fmt1(s.avg)) + " | " + s.n + "/" + asked.length + " | " +
      DIMENSIONS.map(d => s.dims[d.key] === null ? "—" : fmt2(s.dims[d.key])).join(" | ") + " | " +
      Object.values(s.labels).reduce((a, b) => a + b, 0) + " |\n";
  });
  md += "\n## 失败标签分布（全部模型）\n\n| 标签 | 次数 |\n|---|---|\n" +
    FAILURE_LABELS.map(l => "| " + l.name + " | " + (all[l.key] || 0) + " |").join("\n") + "\n\n";
  md += "## 排行榜\n\n" + leaderboardMarkdown();
  md += "\n> 说明：评分为人工判定，总分 = Σ(维度分/5×权重)×100；仅「已完成且五维齐全」的记录参与统计。\n";
  return md;
}

/* ------------------------------ 事件层 ------------------------------ */
document.addEventListener("click", function (e) {
  /* 点击外部时收起「模型选择」与「参考问题」弹层 */
  if (state.chat.modelPopOpen && !e.target.closest(".model-pop2") && !e.target.closest("[data-act='toggle-model-pop']")) {
    state.chat.modelPopOpen = false;
    renderBottomBar();
  }
  if (state.chat.showPicker && !e.target.closest(".picker-pop") && !e.target.closest("[data-act='toggle-picker']")
      && !e.target.closest(".qcard")) {
    state.chat.showPicker = false;
    renderBottomBar();
  }
  const seg = e.target.closest("#segmented button");
  if (seg) {
    state.seg = seg.getAttribute("data-seg");
    state.view = NAV_SEGMENTS[state.seg][0].key;
    state.chat.addingModel = false; state.chat.editing = null;
    renderAll();
    return;
  }
  const nav = e.target.closest("[data-nav]");
  if (nav) {
    const key = nav.getAttribute("data-nav");
    state.view = key;
    if (key === "chat" || key === "records") state.seg = "review";
    else if (key !== "data") state.seg = "analysis";
    state.chat.addingModel = false; state.chat.editing = null;
    renderAll();
    return;
  }
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.getAttribute("data-act");
  const caseId = btn.getAttribute("data-case");
  const modelId = btn.getAttribute("data-model");

  switch (act) {
    /* ---- 会话 ---- */
    case "new-session":
      createSession();
      break;
    case "switch-session":
      switchSession(btn.getAttribute("data-id"));
      break;
    case "delete-session":
      deleteSession(btn.getAttribute("data-id"));
      break;

    /* ---- 选题与提问 ---- */
    case "pick-q": {
      state.chat.selected = caseId;
      state.chat.showPicker = false;      // 选中后收起列表，题干带入输入框
      state.chat.reviewMode = true;       // 选参考问题即进入评审
      renderBottomBar();
      const box = document.getElementById("askInput");
      if (box && box.focus) box.focus();
      break;
    }
    case "send-ask": {
      const box = document.getElementById("askInput");
      const text = box ? box.value.trim() : "";
      if (!text) { toast("先输入内容，或点上面的参考问题", true); break; }
      if (!state.chat.reviewMode) { askDaily(text); break; }   // 日常对话：固定回复
      const target = (state.chat.selected && caseById(state.chat.selected)) || matchCase(text);
      if (target) askQuestion(target.case_id);
      else askQuestion(createFreeQuestion(text));   // 自由提问：新建一条无参考答案的记录
      break;
    }
    case "toggle-mode": {
      state.chat.reviewMode = !state.chat.reviewMode;
      state.chat.modelPopOpen = false;
      persistChat();
      renderBottomBar();
      toast(state.chat.reviewMode ? "已开启评审模式：提问将触发选中模型作答" : "已切换为日常对话");
      break;
    }
    case "toggle-model-pop":
      state.chat.modelPopOpen = !state.chat.modelPopOpen;
      state.chat.addingModel = false;
      renderBottomBar();
      break;
    case "pick-default-model":
      state.chat.reviewMode = false;
      state.chat.modelPopOpen = false;
      persistChat();
      renderBottomBar();
      toast("已选择默认模型：日常对话");
      break;
    case "dd-toggle-model": {
      /* 只增减选中的模型，不切换评审/日常模式 */
      if (!state.chat.reviewMode) break;
      const i = state.chat.active.indexOf(modelId);
      if (i >= 0) {
        if (state.chat.active.length <= 1) { toast("至少保留一个模型参与回答", true); break; }
        state.chat.active.splice(i, 1);
      } else state.chat.active.push(modelId);
      persistChat();
      renderBottomBar();
      break;
    }
    case "toggle-picker":
      state.chat.showPicker = !state.chat.showPicker;
      state.chat.modelPopOpen = false;
      persistChat();
      renderBottomBar();
      break;
    case "expand-round": {
      /* 点摘要行 = 切换该轮展开/收起；多个轮次可同时展开 */
      const i = Number(btn.getAttribute("data-idx"));
      if (i >= 0 && i < state.chat.rounds.length) {
        const at = state.chat.expandedRounds.indexOf(i);
        if (at >= 0) state.chat.expandedRounds.splice(at, 1);
        else state.chat.expandedRounds.push(i);
        renderView();
        const el = document.getElementById("round-" + i);
        if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      break;
    }
    case "collapse-round":
      /* 只收起当前这一轮，其他轮保持展开 */
      (function () {
        const i = Number(btn.getAttribute("data-idx"));
        const at = state.chat.expandedRounds.indexOf(i);
        if (at >= 0) state.chat.expandedRounds.splice(at, 1);
      })();
      renderView();
      break;

    /* ---- 模型管理（下拉内） ---- */

      state.chat.customModels = state.chat.customModels.filter(m => m.id !== modelId);
      state.chat.active = state.chat.active.filter(id => id !== modelId);
      state.answersStore.custom = state.answersStore.custom.filter(a => a.model_id !== modelId);
      Object.keys(state.reviews).forEach(k => { if (state.reviews[k].model_id === modelId) delete state.reviews[k]; });
      state.chat.rounds.forEach(rd => rd.modelIds = rd.modelIds.filter(id => id !== modelId));
      persistChat(); persistAnswers(); persistReviews();
      renderBottomBar(); renderSidebar();
      toast("已移除模型");
      break;
    }
    case "model-new":
      state.chat.addingModel = true; renderBottomBar(); break;
    case "model-new-cancel":
      state.chat.addingModel = false; renderBottomBar(); break;
    case "model-new-confirm": {
      const name = (document.getElementById("newModelName").value || "").trim();
      if (!name) { toast("请填写模型名称", true); break; }
      const vendor = (document.getElementById("newModelVendor").value || "").trim();
      const n = state.chat.customModels.length;
      const id = "custom_" + Date.now().toString(36) + n;
      state.chat.customModels.push({

        color: CUSTOM_MODEL_PALETTE[n % CUSTOM_MODEL_PALETTE.length], custom: true
      });
      state.chat.active.push(id);

      state.chat.addingModel = false;

    }

    /* ---- 回答录入与修改 ---- */

      const tc = document.getElementById("pending_cites_" + modelId);
      const text = ta ? ta.value.trim() : "";
      if (!text) { toast("请先粘贴该模型的回答", true); break; }

    }

      state.chat.editing = state.chat.editing === key ? null : key;
      renderView();
      break;
    }
    case "submit-review": {
      const r = ensureReview(caseId, modelId);
      const missing = DIMENSIONS.filter(d => r.scores[d.key] === null).map(d => d.name);
      r.status = "done";
      r.reviewed_at = new Date().toISOString();
      r.updated_at = r.reviewed_at;

      state.chat.editing = null;

      toast("已导出「" + caseLabel(caseId) + "」（含评审）");
      break;
    }
    case "copy-json":
      copyText(JSON.stringify(buildExport("all"), null, 2)); break;
    case "copy-report":
      copyText(state.view === "leaderboard" ? leaderboardMarkdown() : reportMarkdown()); break;
    case "export-report":
      downloadFile(reportMarkdown(), "fin-agent-eval-report-" + dateStamp() + ".md", "text/markdown");
      toast("已导出汇总报告（Markdown）");
      break;
    case "import-text": {
      const raw = (document.getElementById("importText").value || "").trim();
      if (!raw) { toast("请先粘贴 JSON 内容", true); break; }
      let obj = null;
      try { obj = JSON.parse(raw); } catch (err) { toast("JSON 解析失败：" + err.message, true); break; }
      importData(obj, {
        replace: document.getElementById("impReplace").checked,
        reviews: document.getElementById("impReviews").checked
      });
      break;
    }
    case "reset-all":
      if (!window.confirm("恢复内置演示数据：参考问题、回答与全部评审记录都会被重置，确认继续？")) break;
      state.cases = clone(BUILTIN_CASES);
      state.answersStore = { custom: [], deleted: [] };
      state.reviews = {}; state.seededAt = null;
      state.chat = {
        sessions: [newSession()], currentId: null,
        active: MODELS.map(m => m.id), customModels: [], selected: null, rounds: [],
        reviewMode: true, modelPopOpen: false,
        expandedRounds: [], showPicker: false, addingModel: false, editing: null, animated: {}
      };
      state.chat.currentId = state.chat.sessions[0].id;
      syncSession();
      persistCases(); persistAnswers(); persistReviews(); persistChat();
      try { localStorage.removeItem(LS.seeded); } catch (e) {}
      renderAll(); toast("已恢复内置演示数据");
      break;
    case "clear-reviews":
      if (!window.confirm("清空全部评审记录（参考问题与回答保留）？")) break;
      state.reviews = {}; state.seededAt = null;
      persistReviews(); try { localStorage.removeItem(LS.seeded); } catch (e) {}
      renderAll(); toast("已清空全部评审记录");
      break;
    case "load-demo": {
      let n = 0;
      DEMO_SCORES.forEach(([cid, mid, scores, labels, comment, status], i) => {
        const r = blankReview(cid, mid);
        DIMENSIONS.forEach((d, k) => r.scores[d.key] = scores[k]);
        r.failures = labels.slice(); r.comment = comment; r.status = status;
        r.reviewed_at = status === "done" ? "2025-06-30T20:1" + (i % 10) + ":00+08:00" : null;
        r.demo = true;
        state.reviews[keyOf(cid, mid)] = r; n++;
      });
      state.seededAt = state.seededAt || new Date().toISOString();
      persistReviews(); lsSet(LS.seeded, state.seededAt);
      renderAll(); toast("已载入 " + n + " 条演示评审记录");
      break;
    }
    case "clear-demo": {
      let n = 0;
      Object.keys(state.reviews).forEach(k => { if (state.reviews[k].demo) { delete state.reviews[k]; n++; } });
      state.seededAt = null;
      persistReviews(); try { localStorage.removeItem(LS.seeded); } catch (e) {}
      renderAll(); toast(n ? "已清空 " + n + " 条演示记录" : "没有演示记录");
      break;
    }
    case "restore-answers":
      state.answersStore.deleted = [];
      persistAnswers(); renderAll(); toast("已还原被删除的内置回答");
      break;
  }
});
function MODEL_MAP_IN_ANSWERS(answerId) {
  const all = BUILTIN_ANSWERS.concat(state.answersStore.custom);
  return all.find(a => a.id === answerId);
}
function dateStamp() {
  const d = new Date(); const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes());
}

document.addEventListener("input", function (e) {
  const t = e.target;
  if (!t || !t.matches) return;
  if (t.matches('[data-act="modal-comment"]')) {
    if (state.modal) state.modal.comment = t.value;
    autoGrowTextarea(t);
    return;
  }
  if (!t.matches('[data-act="comment"]')) return;
  {
    const caseId = t.getAttribute("data-case"), modelId = t.getAttribute("data-model");
    if (scoreLocked(caseId, modelId)) return;   // 已提交的评审不允许再改
    const r = ensureReview(caseId, modelId);
    r.comment = t.value;
    if (r.status === "none" && hasAnyReviewContent(r)) {
      r.status = "doing";
      const card = t.closest(".answer-card");
      if (card) card.querySelectorAll(".status-seg button").forEach(b => b.classList.toggle("on", b.getAttribute("data-s") === "doing"));
    }
    scheduleSave(() => { r.updated_at = new Date().toISOString(); r.demo = false; persistReviews(); renderSidebar(); });
    const dEl = document.querySelector('[data-draft="' + modelId + '"]');
    if (dEl) { dEl.textContent = "输入中…自动保存"; dEl.classList.remove("saved"); }
  }
});

document.addEventListener("change", function (e) {
  const t = e.target;
  if (!t || (!t.id && !(t.matches && t.matches("[data-filter]")))) return;
  if (t.id === "lbCase") { state.leaderboardCase = t.value; renderLeaderboard(); return; }
  if (t.id === "fileInput") {
    const f = t.files && t.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      let obj = null;
      try { obj = JSON.parse(String(reader.result)); }
      catch (err) { toast("文件解析失败：" + err.message, true); return; }
      importData(obj, {
        replace: document.getElementById("impReplace").checked,
        reviews: document.getElementById("impReviews").checked
      });
    };
    reader.readAsText(f, "utf-8");
    return;
  }
  if (t.matches("[data-filter]")) {
    state.filters[t.getAttribute("data-filter")] = t.value;
    renderRecords();
    return;
  }
});

document.addEventListener("keydown", function (e) {
  if (!e.target || !e.target.matches) return;
  if (e.target.matches("input,textarea,select")) {
    /* 输入框内 Ctrl/Cmd + Enter 发送提问 */
    if (e.target.id === "askInput" && (e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      const b = document.querySelector('[data-act="send-ask"]');
      if (b) b.click();
    }
    return;
  }
  if (e.key === "Escape") {
    if (state.modal) { closeReviewModal(); return; }
    if (state.chat.editing) { state.chat.editing = null; renderView(); }
  }
});

/* ------------------------------ 启动 ------------------------------ */
loadState();
renderAll();
</script>
